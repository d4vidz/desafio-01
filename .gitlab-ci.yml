stages:
  - validate

governance:
  image: python:3.12-slim
  stage: validate
  before_script:
    - python -m pip install --disable-pip-version-check uv
    - uv sync --frozen
  script:
    - python scripts/check_translation_pairs.py
    - uv run pytest -q
    - uv run marimo check notebooks/spotify_analysis.py notebooks/explorations/popularity_baselines.py notebooks/explorations/musical_structure.py
